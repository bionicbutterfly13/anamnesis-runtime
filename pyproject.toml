[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anamnesis-runtime"
version = "0.1.0"
description = "Host-neutral episodic-semantic memory runtime for cyclic agent systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Mani Saint-Victor, MD" }
]
keywords = [
  "agent-memory",
  "episodic-memory",
  "semantic-memory",
  "memory-runtime",
  "nemori",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/bionicbutterfly13/anamnesis-runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/anamnesis_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["anamnesis_runtime"]
